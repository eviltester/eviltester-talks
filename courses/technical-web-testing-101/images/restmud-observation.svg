<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">RestMud observation points</title><desc id="desc">The page, URL, element identifiers and server logs provide different evidence about the game state.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffdf00"/></marker></defs>
<rect width="1000" height="350" rx="12" fill="#080808"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<line x1="130" y1="125" x2="500" y2="225" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="375" y1="125" x2="500" y2="225" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="625" y1="125" x2="500" y2="225" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="870" y1="125" x2="500" y2="225" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="20" y="28" width="220" height="97" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="130.0" y="62" fill="#ffdf00" font-size="24">Page</text>
<text x="130.0" y="92" fill="#fff" font-size="20">Rooms and objects</text>
<rect x="265" y="28" width="220" height="97" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="375.0" y="62" fill="#ffdf00" font-size="24">URL</text>
<text x="375.0" y="92" fill="#fff" font-size="20">Commands and nouns</text>
<rect x="515" y="28" width="220" height="97" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="625.0" y="62" fill="#ffdf00" font-size="24">DOM</text>
<text x="625.0" y="92" fill="#fff" font-size="20">Object and location IDs</text>
<rect x="760" y="28" width="220" height="97" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="870.0" y="62" fill="#ffdf00" font-size="24">Server log</text>
<text x="870.0" y="92" fill="#fff" font-size="20">JSON and events</text>
<rect x="300" y="225" width="400" height="95" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="500.0" y="259" fill="#ffdf00" font-size="24">Game state and model</text>
