<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc">
<title id="title">HTTP debug proxy</title><desc id="desc">Requests travel from the browser through the proxy to the server. Responses return through the same proxy.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffdf00"/></marker></defs>
<rect width="1000" height="320" rx="12" fill="#080808"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<line x1="285" y1="108" x2="385" y2="108" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="335.0" y="95.0" fill="#fff" font-size="18">request</text>
<line x1="615" y1="108" x2="715" y2="108" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="665.0" y="95.0" fill="#fff" font-size="18">request</text>
<line x1="385" y1="176" x2="285" y2="176" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="335.0" y="163.0" fill="#fff" font-size="18">response</text>
<line x1="715" y1="176" x2="615" y2="176" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="665.0" y="163.0" fill="#fff" font-size="18">response</text>
<rect x="55" y="72" width="230" height="145" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="170.0" y="106" fill="#ffdf00" font-size="24">Browser</text>
<text x="170.0" y="136" fill="#fff" font-size="20">Creates a request</text>
<text x="170.0" y="163" fill="#fff" font-size="20">Renders a response</text>
<rect x="385" y="72" width="230" height="145" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="500.0" y="106" fill="#ffdf00" font-size="24">Debug proxy</text>
<text x="500.0" y="136" fill="#fff" font-size="20">Capture and inspect</text>
<text x="500.0" y="163" fill="#fff" font-size="20">Pause, edit, forward</text>
<rect x="715" y="72" width="230" height="145" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="830.0" y="106" fill="#ffdf00" font-size="24">Server</text>
<text x="830.0" y="136" fill="#fff" font-size="20">Processes a request</text>
<text x="830.0" y="163" fill="#fff" font-size="20">Returns a response</text>
<text x="500" y="276" fill="#fff" font-size="22">Manipulate either direction to investigate client and server behaviour.</text>
</g></svg>
