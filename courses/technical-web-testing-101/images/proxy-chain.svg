<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="280" viewBox="0 0 1020 280" role="img" aria-labelledby="title desc">
<title id="title">The recorded proxy chain</title><desc id="desc">Firefox sends traffic to ZAP on port 8082, then Burp on 8080, Fiddler on 8888, and finally the server.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffdf00"/></marker></defs>
<rect width="1020" height="280" rx="12" fill="#080808"/>
<g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
<line x1="180" y1="120" x2="215" y2="120" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="385" y1="120" x2="420" y2="120" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="590" y1="120" x2="625" y2="120" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="795" y1="120" x2="830" y2="120" stroke="#ffdf00" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="10" y="65" width="170" height="115" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="95.0" y="99" fill="#ffdf00" font-size="24">Firefox</text>
<text x="95.0" y="129" fill="#fff" font-size="20">Client</text>
<rect x="215" y="65" width="170" height="115" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="300.0" y="99" fill="#ffdf00" font-size="24">ZAP</text>
<text x="300.0" y="129" fill="#fff" font-size="20">Port 8082</text>
<rect x="420" y="65" width="170" height="115" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="505.0" y="99" fill="#ffdf00" font-size="24">Burp</text>
<text x="505.0" y="129" fill="#fff" font-size="20">Port 8080</text>
<rect x="625" y="65" width="170" height="115" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="710.0" y="99" fill="#ffdf00" font-size="24">Fiddler</text>
<text x="710.0" y="129" fill="#fff" font-size="20">Port 8888</text>
<rect x="830" y="65" width="170" height="115" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="915.0" y="99" fill="#ffdf00" font-size="24">Server</text>
<text x="915.0" y="129" fill="#fff" font-size="20">Destination</text>
<text x="500" y="235" fill="#fff" font-size="22">Add and verify one hop at a time. Responses return through the chain.</text>
</g></svg>
