<rect x="365" y="12" width="270" height="85" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="500.0" y="46" fill="#ffdf00" font-size="24">Model</text>
<text x="500.0" y="76" fill="#fff" font-size="20">Architecture and unknowns</text>
<rect x="20" y="132" width="275" height="85" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="157.5" y="166" fill="#ffdf00" font-size="24">Observe</text>
<text x="157.5" y="196" fill="#fff" font-size="20">Notice behaviour and data</text>
<rect x="705" y="132" width="275" height="85" rx="9" fill="#151515" stroke="#ff4b4b" stroke-width="2"/>
<text x="842.5" y="166" fill="#ffdf00" font-size="24">Reflect</text>
